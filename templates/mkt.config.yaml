# mkt-harness configuration. Everything has a safe default; see src/core/config.ts.
workspace: ./workspace
timezone: Europe/Madrid        # routines' cron runs in this timezone; brands have their own for quiet hours
engine: claude                 # claude | codex, for `mkt agent` and routines

# review: you approve every post and message (mkt review). autopilot: agents decide and the harness approves the kinds
# below when they're drafted; limits, consent, suppression and "hold" still apply. Switch with: mkt autopilot on|off
mode: review
autopilot:
  kinds: [post, reply, dm, comment, connect, email]

approval:
  # true = a human approves in `mkt review` before anything is sent
  required: { post: true, dm: true, reply: true, comment: true, connect: true, email: true }
  allowAgentApproval: false    # true lets the outbox_approve MCP tool work (not in headless routines)

quietHours: { start: "21:00", end: "08:30" }   # cold outreach waits outside these hours (brand timezone)

# Per-account limits per rolling 24h. Defaults in src/core/config.ts (DEFAULT_LIMITS). Override like:
# limits:
#   linkedin: { dm: { perDay: 20, minGapSec: 240 } }
#   default:  { "*": { perDay: 15, minGapSec: 180 } }
limits: {}

outreach:
  maxTouchesPerLead: 4         # cold touches without a reply, then stop
  minHoursBetweenTouches: 48
  emailFooter: "If you'd rather not hear from us, reply \"stop\" and we won't write again."

browser:
  executablePath: null         # default: installed Google Chrome
  headless: false              # visible windows; you can watch every action
  settleMs: 1200

inbox:
  syncEveryMin: 15

runner:
  claude: { bin: claude, maxBudgetUsd: 3 }
  codex: { bin: codex }
  timeoutMin: 45

# Scheduled headless runs (`mkt daemon`). Enable the ones you want.
routines:
  - name: trend-radar
    cron: "0 8 * * 1-5"
    enabled: false
    brand: example
    prompt: "Use the trend-radar skill: collect today's signals, record observations, update trends/radar.md, and create up to 3 idea items for rising trends that fit the brand."
  - name: inbox-triage
    cron: "*/30 9-20 * * *"
    enabled: false
    brand: example
    prompt: "Use the inbox skill: sync inboxes, classify new messages, record insights and lead updates, and draft replies (they stay pending approval)."
  - name: follow-ups
    cron: "0 10 * * 1-5"
    enabled: false
    brand: example
    prompt: "Use the outreach skill: find leads whose nextActionAt is due or who were contacted 3+ days ago without reply, and draft the next sequence step for each (pending approval)."
  - name: weekly-plan
    cron: "0 7 * * 1"
    enabled: false
    brand: example
    prompt: "Use analytics-review on last week, then content-strategy + idea-engine to plan this week's calendar: 5-7 items scored and briefed, and write reports/week-<date>.md."
